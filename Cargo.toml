[workspace]
members = [
    "crates/mcv-common",
    "crates/mcv-messages",
    "crates/mcv-plugin-interface",
    "crates/mcv-plugin-exe-interface",
    "crates/mcv-plugin-loader",
    "crates/mcv-updater",
    "crates/mcv-logger",
    "crates/mcv-tracing",
    "crates/mcv-core",
    "crates/plugin-dummy",
    "crates/plugin-exe-manager",
    "crates/plugin-youtube-live",
    "apps/mcv/src-tauri",
    "apps/log-viewer/src-tauri",
    "apps/installer/src-tauri",
    "apps/exe-plugin-sample/src-tauri",
    "crates/twitch-lib",
    "xtask",
    "crates/youtube-live-lib",
    "crates/plugin-sample-v2",
    "crates/plugin-abi-helper",
    "crates/plugin-sample-v3", "crates/plugin-sample-v4",
]
resolver = "2"

[workspace.dependencies]
actix = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
thiserror = "1.0"
tauri = { version = "2.9.1", features = [] }
