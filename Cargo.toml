[workspace]
members = [
    "crates/mcv-common",
    "crates/mcv-messages",
    "crates/mcv-plugin-interface",
    "crates/mcv-plugin-exe-interface",
    "crates/mcv-plugin-loader",
    "crates/mcv-plugin-loader-v3",
    "crates/mcv-updater",
    "crates/mcv-log-schema",
    "crates/mcv-log-core",
    "crates/mcv-plugin-telemetry",
    "crates/mcv-settings-core",
    "crates/mcv-core",
    "crates/plugin-dummy",
    "crates/plugin-exe-manager",
    "crates/plugin-exe-manager-v3",
    "crates/plugin-youtube-live",
    "apps/mcv/src-tauri",
    "apps/log-viewer/src-tauri",
    "apps/exe-plugin-sample/src-tauri",
    "crates/twitch-lib",
    "xtask",
    "crates/youtube-live-lib",
    "crates/plugin-sample-v2",
    "crates/plugin-abi-helper",
    "crates/plugin-sample-v3",
    "crates/export-plugin-v3-macros",
    "examples/youtube-live-lib-getcomments",
    "crates/plugin-chrome-cookie",
    "crates/plugin-cookies-txt",
    "crates/plugin-bouyomi",
    "crates/plugin-twitch",
    "crates/plugin-twicas",
    "crates/kick-lib",
    "crates/plugin-kick",
    "crates/plugin-nicolive",
    "crates/nicolive-lib",
    "crates/twicas-lib",
    "crates/twicas-secret-extractor",
    "tools/extract-secret",
]
resolver = "2"

[workspace.dependencies]
actix = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.22.0", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
tokio = { version = "1.50.0", features = ["full"] }
async-trait = "0.1"
thiserror = "2.0.18"
tauri = { version = "=2.10.1", features = [] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0"
once_cell = "1.21.4"
futures-util = "0.3.32"
backtrace = "0.3"
libloading = "0.9.0"
libc = "0.2.183"
rusqlite = { version = "0.39.0", features = ["bundled"] }
zip = "8.2.0"
regex = "1"
