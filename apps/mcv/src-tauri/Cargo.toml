[package]
name = "MultiCommentViewer"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
mcv-core = { path = "../../../crates/mcv-core" }
mcv-messages = { path = "../../../crates/mcv-messages" }
mcv-updater = { path = "../../../crates/mcv-updater" }
mcv-logger = { path = "../../../crates/mcv-logger" }
tauri = { workspace = true, features = ["devtools"] }
tauri-plugin-opener = "2.0"
serde = { workspace = true }
serde_json = { workspace = true }
actix = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tracing = "0.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
alpha = ["mcv-logger/alpha"]
beta = ["mcv-logger/beta"]
stable = ["mcv-logger/stable"]
