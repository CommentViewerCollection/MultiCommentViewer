[package]
name = "MultiCommentViewer"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

[dependencies]
mcv-common = { path = "../../../crates/mcv-common" }
mcv-core = { path = "../../../crates/mcv-core" }
mcv-messages = { path = "../../../crates/mcv-messages" }
mcv-updater = { path = "../../../crates/mcv-updater" }
mcv-log-core = { path = "../../../crates/mcv-log-core" }
mcv-settings-core = { path = "../../../crates/mcv-settings-core" }
tauri = { workspace = true, features = ["devtools"] }
tauri-plugin-opener = "2.0"
tauri-plugin-dialog = "2.0"
serde = { workspace = true }
serde_json = { workspace = true }
actix = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }
tokio-tungstenite = "0.28.0"
futures-util = { workspace = true }
zip = { workspace = true }
rusqlite = { workspace = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
alpha = ["mcv-log-core/alpha"]
beta = ["mcv-log-core/beta"]
stable = ["mcv-log-core/stable"]
