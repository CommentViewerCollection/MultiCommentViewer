[package]
name = "mcv-plugin-exe-interface"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core dependencies
mcv-messages = { path = "../mcv-messages" }

# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-tungstenite = "0.26"

# WebSocket
tungstenite = "0.26"
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"

chrono = "0.4"

[dev-dependencies]
tokio-test = "0.4"
