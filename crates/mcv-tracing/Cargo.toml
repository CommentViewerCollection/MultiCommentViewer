[package]
name = "mcv-tracing"
version = "0.1.0"
edition = "2021"

[dependencies]
# Tracing ecosystem
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Local crates
mcv-messages = { path = "../mcv-messages" }
mcv-plugin-interface = { path = "../mcv-plugin-interface" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# UUID
uuid = { workspace = true }

# Time
chrono = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Stacktrace
backtrace = "0.3"

mcv-logger = { path = "../mcv-logger" }

[features]
alpha = ["mcv-logger/alpha"]
beta = ["mcv-logger/beta"]
stable = ["mcv-logger/stable"]
