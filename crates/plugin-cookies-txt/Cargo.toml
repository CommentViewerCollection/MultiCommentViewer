[package]
name = "plugin-cookies-txt"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
mcv-messages = { path = "../mcv-messages" }
plugin-abi-helper = { path = "../plugin-abi-helper" }
cookies-txt = { path = "../cookies_txt_reader" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
tokio = { version = "1.0", features = ["full"] }
dirs = "5"
