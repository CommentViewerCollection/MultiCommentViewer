[package]
name = "plugin-exe-manager-v3"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core dependencies
mcv-plugin-interface = { path = "../mcv-plugin-interface" }
mcv-messages = { path = "../mcv-messages" }
mcv-tracing = { path = "../mcv-tracing" }
plugin-abi-helper = { path = "../plugin-abi-helper" }
export-plugin-v3-macros = { path = "../export-plugin-v3-macros" }

# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Async trait
async-trait = "0.1"

# File watching (optional for now)
# notify = "7.0"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.14"

[features]
alpha = ["mcv-tracing/alpha","plugin-abi-helper/alpha"]
beta = ["mcv-tracing/beta","plugin-abi-helper/beta"]
stable = ["mcv-tracing/stable","plugin-abi-helper/stable"]
