[package]
name = "plugin-exe-manager"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[features]
alpha = []
beta = []
stable = []

[dependencies]
# Core dependencies
mcv-plugin-interface = { path = "../mcv-plugin-interface" }
mcv-messages = { path = "../mcv-messages" }
mcv-plugin-telemetry = { path = "../mcv-plugin-telemetry" }
plugin-abi-helper = { path = "../plugin-abi-helper" }

# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Async trait
async-trait = "0.1"

# File watching (optional for now)
# notify = "7.0"

# C FFI
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.14"
