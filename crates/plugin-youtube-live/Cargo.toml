[package]
name = "plugin-youtube-live"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
alpha = ["mcv-logger/alpha", "mcv-tracing/alpha"]
beta = ["mcv-logger/beta", "mcv-tracing/beta"]
stable = ["mcv-logger/stable", "mcv-tracing/stable"]

[dependencies]
mcv-messages = { path = "../../crates/mcv-messages" }
mcv-plugin-interface = { path = "../../crates/mcv-plugin-interface" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
rand = "0.8"
once_cell = "1.20"
youtube-live-lib = { path = "../../crates/youtube-live-lib"}
mcv-logger = { path = "../../crates/mcv-logger" }
mcv-tracing = { path = "../../crates/mcv-tracing" }
tracing = "0.1"
tracing-subscriber = "0.3"
