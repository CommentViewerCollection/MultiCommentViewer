[package]
name = "youtube-live-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
reqwest = { version = "0.11", features = ["json", "gzip", "stream", "deflate"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
async-trait = "0.1"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
mcv-plugin-telemetry = { path = "../mcv-plugin-telemetry" }
tracing = "0.1"
tracing-subscriber = "0.3"
sha1 = "0.10"

[features]
alpha = ["mcv-plugin-telemetry/alpha"]
beta = ["mcv-plugin-telemetry/beta"]
stable = ["mcv-plugin-telemetry/stable"]
